# Release: tag vX.Y.Z -> full checks -> build and prove the packages
# (package.yml: agenti-runtime for amd64 and arm64, agenti, lintian, install /
# upgrade / remove / purge on clean Kali, Debian and Ubuntu) -> checksums and
# provenance attestation -> (only if publishing is switched on) a GitHub
# Release.
#
# PUBLISHING IS OFF. Everything is kept as a workflow artifact for
# inspection, but nothing becomes public until the repository variable
# RELEASE_PUBLISH is "true" (Settings > Secrets and variables > Actions >
# Variables). Do that only after the security audit of the installed package
# (docs/packaging.md) and once the repo is public.
# The apt repository's InRelease is signed by hand with the hardware key,
# never here (docs/open-core-split.md § CI/CD).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:          # dry run from the Actions tab; never publishes

permissions:
  contents: read

jobs:
  checks:
    name: Full checks on the tagged commit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.10 shellcheck-py==0.11.0.1 cryptography==50.0.1
      - run: shared/ci.sh all
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - run: ./gitleaks git --no-banner --redact .

  package:
    name: Build and prove the packages
    needs: checks
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || 'dev' }}

  attest:
    name: Checksums and provenance
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write         # provenance attestation
      attestations: write
    # Signs exactly the three packages the build jobs made, by the digests those
    # jobs reported. It used to sign every .deb among ALL of the run's
    # artifacts, and any job, including a container job running a pulled
    # image's code, can upload one: a fixture run showed a planted file signed
    # in place of the real package (audit run 2).
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agenti-deb
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-amd64
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-arm64
          path: dist/
      - name: Checksums from the build jobs, checked against the files
        env:
          A_DEB: ${{ needs.package.outputs.agenti_deb }}
          A_SHA: ${{ needs.package.outputs.agenti_sha256 }}
          R1_DEB: ${{ needs.package.outputs.runtime_amd64_deb }}
          R1_SHA: ${{ needs.package.outputs.runtime_amd64_sha256 }}
          R2_DEB: ${{ needs.package.outputs.runtime_arm64_deb }}
          R2_SHA: ${{ needs.package.outputs.runtime_arm64_sha256 }}
        run: |
          set -euo pipefail
          cd dist
          for n in "$A_DEB" "$R1_DEB" "$R2_DEB"; do
            [[ "$n" =~ ^[A-Za-z0-9._+~-]+\.deb$ ]] || { echo "unexpected package name: '$n'"; exit 1; }
          done
          for d in "$A_SHA" "$R1_SHA" "$R2_SHA"; do
            [[ "$d" =~ ^[0-9a-f]{64}$ ]] || { echo "a build job reported no digest"; exit 1; }
          done
          printf '%s  %s\n' "$A_SHA" "$A_DEB" "$R1_SHA" "$R1_DEB" "$R2_SHA" "$R2_DEB" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          extra=$(ls -1A | grep -vxF -e SHA256SUMS -e "$A_DEB" -e "$R1_DEB" -e "$R2_DEB" || true)
          [[ -z "$extra" ]] || { echo "files no build job made: $extra"; exit 1; }
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agenti-release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (off unless RELEASE_PUBLISH=true)
    needs: attest
    if: github.event_name == 'push' && vars.RELEASE_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agenti-release
          path: dist/
      # The gh CLI is preinstalled on the runner; no third-party release action.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "Agenti ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
