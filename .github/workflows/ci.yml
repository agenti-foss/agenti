# CI: runs on every push to master and on every pull request.
#
# The checks themselves live in shared/ci.sh, not here, so you can run the
# same thing at your desk (`shared/ci.sh`). This file only provides the
# machine to run them on. Third-party actions are pinned to a commit hash
# (the comment names the release) so a hijacked tag can't change what runs;
# Dependabot proposes updates (.github/dependabot.yml).
name: CI

on:
  push:
    branches: [master]
  pull_request:

# The checks only read the repo.
permissions:
  contents: read

# A newer push to the same branch makes an older, still-running one pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (python, bash, javascript, json)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Tool versions are pinned so a new release can't turn CI red on its own.
      - run: pip install ruff==0.16.10 shellcheck-py==0.11.0.1
      - run: shared/ci.sh lint

  test:
    name: Tests (every shared/test_*.py)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # The one third-party package any suite imports, at the version
      # agenti-runtime pins for authd (packaging/runtime/authd.lock).
      - run: pip install cryptography==50.0.1
      - run: shared/ci.sh test

  secrets:
    name: Secrets scan (whole git history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # the scan reads every commit, not just the latest
      # Downloaded by hand and checked against a pinned SHA-256 rather than
      # using a marketplace action: one fewer third party in a job that can
      # see the whole history. Findings are redacted in the log.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      # Known-fake tokens are listed in .gitleaksignore.
      - run: ./gitleaks git --no-banner --redact .
