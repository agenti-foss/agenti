# Weekly pull requests that bump the pinned GitHub Actions in
# .github/workflows/. Review and merge them; CI runs on each one first.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must be the same version or CodeQL refuses to run.
      codeql:
        patterns: ["github/codeql-action*"]
