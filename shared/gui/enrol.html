<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenti — Set up your account</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/arcade.css">
<script src="js/theme.js"></script>
<script src="js/api.js" defer></script>
<script src="js/password-gen.js" defer></script>
</head>
<body>
  <div class="login-wrap">
    <div class="panel login-card enrol-card" style="max-width:520px;">
      <h1 id="enrol-title">Welcome</h1>
      <p class="sub muted" id="enrol-sub">Checking your link…</p>
      <ol class="setup-progress" id="enrol-progress" aria-label="Setup steps" hidden>
        <li data-step="1" class="done">Setup code</li>
        <li data-step="2" aria-current="step">Your account</li>
        <li data-step="3">Finish</li>
      </ol>

      <div id="enrol-banner" class="banner err"></div>

      <form id="enrol-form" hidden>
        <h2>1. Choose a password</h2>
        <!-- For password managers: this is a sign-up for this account. -->
        <input type="text" id="enrol-username" name="username" autocomplete="username"
               class="sr-only" tabindex="-1" aria-hidden="true" readonly>
        <div class="field">
          <label for="enrol-password">Password</label>
          <input type="password" id="enrol-password" name="new-password" autocomplete="new-password" required>
        </div>

        <h2 id="enrol-totp-heading">2. Set up two-factor authentication</h2>
        <div class="qr-row">
          <div id="enrol-qr"></div>
          <div class="qr-side">
            <div class="field">
              <label id="enrol-secret-label">Secret:</label>
              <div class="secret-box" aria-labelledby="enrol-secret-label"><code id="enrol-secret"></code></div>
            </div>
            <div class="field">
              <label for="enrol-totp-code">Code from the app, right now</label>
              <input type="text" id="enrol-totp-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code">
            </div>
          </div>
        </div>
        <label id="enrol-skip-wrap" style="display:flex; align-items:center; gap:8px; margin:6px 0 12px;" hidden>
          <input type="checkbox" id="enrol-skip" style="width:auto;"> Skip 2FA for now (you can turn it on later from Settings)
        </label>

        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Finish setting up</button>
      </form>

      <div id="enrol-done" hidden>
        <div class="banner ok show">Your account is ready.</div>
        <div id="enrol-recovery" hidden>
          <p class="hint"><strong>Recovery codes</strong> — each works once. Save them now; they won't be shown again.</p>
          <div class="copyable"><pre id="enrol-recovery-codes" class="feed" style="font-size:0.85rem; flex:1; margin:0;"></pre></div>
        </div>
        <a class="btn btn-primary" href="login.html" id="enrol-signin" style="width:100%; justify-content:center; margin-top:12px;">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    // No auth on this page by design — see shared/api/main.py's comment on
    // GET/POST /enrol/{token}. The token itself is the proof; it is
    // single-use and expires (iam.ENROLMENT_TOKEN_TTL_S), so this page's
    // whole job is to spend it exactly once, checking first so a stale link
    // says so plainly instead of failing opaquely on submit.
    //
    // 2FA (CLAUDE.md §4 item 25): GET /enrol/{token} says whether the
    // require-2fa policy applies to this account and hands over a CANDIDATE
    // secret (nothing is stored — the same two-step shape as Settings' own
    // enrol/confirm). The server only commits it when the code typed here
    // was generated from it, so a mistyped secret or a wrong clock can never
    // leave the account enrolled in a factor it cannot produce.
    //
    // The password box comes filled with a generated password (password-gen.js);
    // the QR code is drawn here in the site's own style (Agenti.qrCode).
    document.addEventListener("DOMContentLoaded", async () => {
      const token = new URLSearchParams(location.search).get("token") || "";
      const title = document.getElementById("enrol-title");
      const sub = document.getElementById("enrol-sub");
      const banner = document.getElementById("enrol-banner");
      const form = document.getElementById("enrol-form");
      const done = document.getElementById("enrol-done");
      const skipWrap = document.getElementById("enrol-skip-wrap");
      const skip = document.getElementById("enrol-skip");
      const codeInput = document.getElementById("enrol-totp-code");
      // Step 2 of first-run setup (setup.html): the same enrolment, then sign
      // in and come back to setup.html for the optional steps.
      const setup = new URLSearchParams(location.search).get("setup") === "1";
      if (setup) {
        document.getElementById("enrol-progress").hidden = false;
        document.querySelector(".login-card").classList.add("setup-card");
        document.getElementById("enrol-signin").href = "login.html?next=setup.html";
        document.getElementById("enrol-signin").textContent = "Sign in to finish";
      }

      if (!token) {
        sub.textContent = "This link is missing its token.";
        Agenti.banner(banner, "err", "Ask whoever invited you for a fresh link.");
        return;
      }

      let info;
      try {
        info = await Agenti.get(`enrol/${encodeURIComponent(token)}`, { noRedirect: true });
      } catch (err) {
        if (err.status === 429) {
          sub.textContent = "Too many tries from this address.";
          Agenti.banner(banner, "err", "Wait a few minutes, then open the link again.");
        } else {
          sub.textContent = "This link is invalid or has expired.";
          Agenti.banner(banner, "err", "Ask an admin to send you a new one — links are valid for 48 hours and work once.");
        }
        return;
      }

      title.textContent = `Welcome, ${info.user}`;
      sub.textContent = setup ? "Set up Agenti" : "Set up your account";
      document.getElementById("enrol-username").value = info.user;
      const pw = AgentiPassword.attach(document.getElementById("enrol-password"));
      form.hidden = false;

      // The second factor: mandatory under the policy, offered otherwise
      // (then the "Skip" box says so).
      const required = !!info.totp_required;
      const qr = Agenti.qrCode(info.qr_modules, "QR code for your authenticator app");
      if (qr) document.getElementById("enrol-qr").appendChild(qr);
      const secretEl = document.getElementById("enrol-secret");
      secretEl.textContent = info.totp_secret || "";
      secretEl.parentElement.appendChild(Agenti.copyButton(info.totp_secret || "", "Copy secret"));
      codeInput.required = required;
      if (!required) {
        skipWrap.hidden = false;
        skip.addEventListener("change", () => {
          codeInput.disabled = skip.checked;
          if (skip.checked) codeInput.value = "";
        });
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        banner.className = "banner";
        const problem = pw.check();
        if (problem) { Agenti.banner(banner, "err", problem); return; }
        const code = codeInput.value.trim();
        const enrolling = !(skip.checked && !required);
        if (enrolling && !/^[0-9]{6}$/.test(code)) {
          Agenti.banner(banner, "err", required
            ? "Enter the 6-digit code from your authenticator app — 2FA is required for this account."
            : "Enter the 6-digit code from your authenticator app, or tick “Skip 2FA for now”.");
          return;
        }
        const body = { new: pw.value };
        if (enrolling) { body.totp_secret = info.totp_secret; body.totp_code = code; }
        const btn = form.querySelector("button[type=submit]");
        btn.disabled = true;
        try {
          const r = await Agenti.post(`enrol/${encodeURIComponent(token)}`, body, { noRedirect: true });
          await pw.saved(info.user);
          form.hidden = true;
          done.hidden = false;
          if (setup) {
            const [, two, three] = document.querySelectorAll("#enrol-progress li");
            two.classList.add("done"); two.removeAttribute("aria-current");
            three.setAttribute("aria-current", "step");
          }
          if (r.recovery_codes && r.recovery_codes.length) {
            const pre = document.getElementById("enrol-recovery-codes");
            pre.textContent = r.recovery_codes.join("\n");
            pre.parentElement.appendChild(Agenti.copyButton(r.recovery_codes.join("\n"), "Copy recovery codes"));
            document.getElementById("enrol-recovery").hidden = false;
          }
        } catch (err) {
          Agenti.banner(banner, "err", Agenti.errorText(err));
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
