<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenti — Reset your password</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/arcade.css">
<script src="js/theme.js"></script>
<script src="js/api.js" defer></script>
<script src="js/password-gen.js" defer></script>
</head>
<body>
  <div class="login-wrap">
    <div class="panel login-card" style="max-width:480px;">
      <h1>Reset your password</h1>
      <p class="sub muted" id="reset-sub">Checking your link…</p>

      <div id="reset-banner" class="banner err"></div>

      <form id="reset-form" hidden>
        <!-- For password managers: this is a new password for this account. -->
        <input type="text" id="reset-username" name="username" autocomplete="username"
               class="sr-only" tabindex="-1" aria-hidden="true" readonly>
        <div class="field">
          <label for="reset-password">New password<button type="button" class="info-tip" aria-label="More information" data-tip="Your 2FA stays as it is."></button></label>
          <input type="password" id="reset-password" name="new-password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Set new password</button>
      </form>

      <div id="reset-done" hidden>
        <div class="banner ok show">Your password has been changed.</div>
        <a class="btn btn-primary" href="login.html" style="width:100%; justify-content:center; margin-top:12px;">Sign in</a>
      </div>
    </div>
  </div>

  <script>
    // No auth on this page by design — the same "the token itself is the
    // credential" shape as enrol.html, for the opposite case: an
    // ALREADY-enrolled account whose admin minted a one-time reset link
    // (iam.mint_password_reset_link, §4's "Global admins can reset a
    // user's password or MFA" item). Single-use, short-lived
    // (iam.PASSWORD_RESET_TOKEN_TTL_S), and touches ONLY the password —
    // 2FA/passkeys are a deliberately separate admin action (reset MFA),
    // never something this link can reach.
    document.addEventListener("DOMContentLoaded", async () => {
      const token = new URLSearchParams(location.search).get("token") || "";
      const sub = document.getElementById("reset-sub");
      const banner = document.getElementById("reset-banner");
      const form = document.getElementById("reset-form");
      const done = document.getElementById("reset-done");

      if (!token) {
        sub.textContent = "This link is missing its token.";
        Agenti.banner(banner, "err", "Ask an admin for a fresh link.");
        return;
      }

      let info;
      try {
        info = await Agenti.get(`password-reset/${encodeURIComponent(token)}`, { noRedirect: true });
      } catch (err) {
        sub.textContent = "This link is invalid or has expired.";
        Agenti.banner(banner, "err", "Ask an admin to send you a new one — links are valid for 24 hours and work once.");
        return;
      }

      sub.textContent = `Welcome back, ${info.user}. Choose a new password.`;
      document.getElementById("reset-username").value = info.user;
      const pw = AgentiPassword.attach(document.getElementById("reset-password"));
      form.hidden = false;

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        banner.className = "banner";
        const problem = pw.check();
        if (problem) { Agenti.banner(banner, "err", problem); return; }
        const btn = form.querySelector("button[type=submit]");
        btn.disabled = true;
        try {
          await Agenti.post(`password-reset/${encodeURIComponent(token)}`,
            { new_password: pw.value }, { noRedirect: true });
          await pw.saved(info.user);
          form.hidden = true;
          done.hidden = false;
        } catch (err) {
          Agenti.banner(banner, "err", Agenti.errorText(err));
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
